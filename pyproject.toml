[project]
name = "pdfinfo"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pymupdf>=1.28.2",
]

[project.scripts]
gen-fonts = "gen_fonts:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cmake>=4.4.4",
    "ninja>=1.13.2",
]



[tool.ruff]
extend-select = ["I"]

[tool.uv]
# We only use it uv for cmake and some scripts
package = false
