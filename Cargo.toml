[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
    ".",
    "crates/pdf-engine",
    "crates/font-locator",
    "crates/common",
    "crates/common-build"
]
exclude = ["crates/gtk", "crates/windows"]


[package]
name = "pdfinfo"
version = "1.2.0"
edition = "2024"


[features]
gtk = ["dep:pdfinfo-gtk"]

[dependencies]
pdfinfo-gtk = { path = "crates/gtk", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
pdfinfo-gtk = { path = "crates/gtk" }

[target.'cfg(target_os = "windows")'.dependencies]
pdfinfo-windows = { path = "crates/windows" }
