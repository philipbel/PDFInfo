[workspace]
resolver = "3"
members = [".", "crates/*"]

[package]
name = "pdfinfo"
version = "1.2.0"
edition = "2024"


[workspace.dependencies]
thiserror = "2.0.21"
env_logger = "0.11.11"
log = "0.4.34"
anyhow = "1.0.104"
strum = { version = "0.28.0", features = ["derive"] }
const_format = "0.2.37"
formatx = "0.4.2"


[features]
gtk = ["dep:pdfinfo-gtk"]
wx = ["dep:pdfinfo-wx"]

[dependencies]
pdfinfo-gtk = { path = "crates/gtk", optional = true }
pdfinfo-wx = { path = "crates/wx", optional = true }
env_logger = { workspace = true }
log = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
pdfinfo-gtk = { path = "crates/gtk"}

[target.'cfg(target_os = "windows")'.dependencies]
pdfinfo-wx = { path = "crates/wx" }

[target.'cfg(target_os = "macos")'.dependencies]
pdfinfo-wx = { path = "crates/wx" }
pdfinfo-gtk = { path = "crates/gtk"}

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1.4"
